# Renova o Developer Mode da TV LG todo dia (o mesmo que o botão "Extend" no app Developer Mode).
# O token da sessão fica no segredo LG_DEVMODE_TOKEN (lido da TV em /var/luna/preferences/devmode_enabled).
name: Renovar Developer Mode

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar sessão
        env:
          TOKEN: ${{ secrets.LG_DEVMODE_TOKEN }}
        run: |
          set -e
          res=$(curl -fsS --retry 3 "https://developer.lge.com/secure/ResetDevModeSession.dev?sessionToken=$TOKEN")
          echo "reset: $res"
          echo "$res" | grep -q '"result":"success"'
          echo "check: $(curl -fsS "https://developer.lge.com/secure/CheckDevModeSession.dev?sessionToken=$TOKEN")"

      # O GitHub desliga tarefas agendadas em repositórios sem commits há 60 dias.
      - uses: actions/checkout@v4
      - name: Manter a tarefa ativa
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: renovação do Developer Mode"
            git push
          fi
